name: mercapos

services:
  couchdb:
    image: couchdb:3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD:-MercaPOSadmin2026}
    ports:
      - "127.0.0.1:5985:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    build: ./deploy
    image: mercapos-tools
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_ADMIN_USERNAME: admin
      COUCHDB_ADMIN_PASSWORD: ${COUCHDB_ADMIN_PASSWORD:-MercaPOSadmin2026}
      API_COUCHDB_USERNAME: ${API_COUCHDB_USERNAME:-mercapos_api}
      API_COUCHDB_PASSWORD: ${API_COUCHDB_PASSWORD:-MercaPOSapi2026}
      COUCHDB_DATABASE: mercapos
      COUCHDB_AUTH_DATABASE: mercapos_auth
    volumes:
      - ./mercapos-db:/mercapos-db:ro
    command:
      - sh
      - -c
      - >-
        python3 /app/prepare.py &&
        python3 /mercapos-db/tools/preparar_cuenta_api.py &&
        python3 /mercapos-db/tools/instalar_esquema.py --database mercapos
    restart: "no"

  api:
    build: ./mercapos_api
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      COUCHDB_URL: http://couchdb:5984/
      COUCHDB_USERNAME: ${API_COUCHDB_USERNAME:-mercapos_api}
      COUCHDB_PASSWORD: ${API_COUCHDB_PASSWORD:-MercaPOSapi2026}
      COUCHDB_DATABASE: mercapos
      COUCHDB_AUTH_DATABASE: mercapos_auth
      API_ADDRESS: 0.0.0.0:3000
      MERCAPOS_BOOTSTRAP_TOKEN: ${MERCAPOS_BOOTSTRAP_TOKEN:-mercapos-bootstrap-demo}
      MERCAPOS_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  seed:
    build: ./deploy
    image: mercapos-tools
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3000
      MERCAPOS_BOOTSTRAP_TOKEN: ${MERCAPOS_BOOTSTRAP_TOKEN:-mercapos-bootstrap-demo}
      DEMO_USER: ${DEMO_USER:-usuario:demo-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-MercaPOS2026}
      DEMO_PUESTO: ${DEMO_PUESTO:-puesto:demo}
    restart: "no"

  web:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./mercapos_flutter/build/web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  couchdb_data:
